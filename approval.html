<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="建设项目行政审批进度管理">
  <title>行政审批进度管理</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --text: #172033;
      --text-muted: #64748b;
      --border: #dbe3ee;
      --surface: #ffffff;
      --background: #f3f6fa;
      --success: #047857;
      --success-light: #ecfdf5;
      --warning: #b45309;
      --warning-light: #fffbeb;
      --neutral: #475569;
      --neutral-light: #f1f5f9;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }

    button,
    select { font: inherit; }

    .page-header {
      color: #fff;
      background: linear-gradient(120deg, #102a56, #1d4ed8);
      border-bottom: 4px solid #60a5fa;
    }

    .page-header__inner,
    main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .page-header__inner { padding: 34px 0 32px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      margin-bottom: 14px;
      color: #dbeafe;
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible { color: #fff; }

    h1,
    p { margin-top: 0; }

    h1 {
      margin-bottom: 6px;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.25;
    }

    .page-header p {
      margin-bottom: 0;
      color: #dbeafe;
    }

    main { padding: 34px 0 56px; }

    .approval-panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
    }

    .filter-field {
      display: flex;
      min-width: 220px;
      flex-direction: column;
      gap: 6px;
    }

    .filter-field label {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
    }

    .filter-field select {
      min-height: 42px;
      padding: 8px 36px 8px 12px;
      color: var(--text);
      background: #fff;
      border: 1px solid #b8c5d6;
      border-radius: 6px;
      cursor: pointer;
    }

    .filter-field select:focus-visible,
    .back-link:focus-visible {
      outline: 3px solid rgba(96, 165, 250, 0.45);
      outline-offset: 2px;
    }

    .result-count {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .result-count strong {
      color: var(--primary-dark);
      font-size: 18px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th,
    td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      color: #334155;
      background: #f8fafc;
      font-size: 14px;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f8fbff; }

    .item-name { font-weight: 700; }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status--pending {
      color: var(--neutral);
      background: var(--neutral-light);
    }

    .status--processing {
      color: var(--warning);
      background: var(--warning-light);
    }

    .status--completed {
      color: var(--success);
      background: var(--success-light);
    }

    .empty-state {
      padding: 40px 24px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 680px) {
      .page-header__inner,
      main { width: min(100% - 28px, 1180px); }

      .page-header__inner { padding: 26px 0 24px; }
      main { padding: 24px 0 40px; }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 14px;
        padding: 18px;
      }

      .filter-field { min-width: 0; }

      table,
      tbody,
      tr,
      td { display: block; }

      thead {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      tbody { padding: 0 18px 18px; }

      tbody tr {
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      td {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 10px;
        padding: 8px 0;
        border-bottom: 0;
      }

      td::before {
        color: var(--text-muted);
        content: attr(data-label);
        font-size: 13px;
        font-weight: 700;
      }

      .empty-state { display: block; }
      .empty-state::before { content: none; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header__inner">
      <a class="back-link" href="index.html" aria-label="返回项目首页">← 返回项目首页</a>
      <h1>行政审批进度管理</h1>
      <p>集中查看建设项目各项行政审批事项及当前办理进度。</p>
    </div>
  </header>

  <main>
    <section class="approval-panel" aria-labelledby="approval-list-title">
      <div class="toolbar">
        <div class="filter-field">
          <label for="status-filter" id="approval-list-title">按审批状态筛选</label>
          <select id="status-filter">
            <option value="全部">全部状态</option>
            <option value="待启动">待启动</option>
            <option value="办理中">办理中</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <p class="result-count" aria-live="polite">共展示 <strong id="result-count">0</strong> 项</p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">审批事项名称</th>
              <th scope="col">主管部门</th>
              <th scope="col">计划完成时间</th>
              <th scope="col">当前状态</th>
            </tr>
          </thead>
          <tbody id="approval-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const approvalItems = [
      { name: "建设用地规划许可证", department: "自然资源和规划局", plannedDate: "2026-03-15", status: "已完成" },
      { name: "建设工程规划许可证", department: "自然资源和规划局", plannedDate: "2026-05-30", status: "已完成" },
      { name: "建设工程消防设计审查", department: "住房和城乡建设局", plannedDate: "2026-08-20", status: "办理中" },
      { name: "建筑工程施工许可证", department: "住房和城乡建设局", plannedDate: "2026-09-10", status: "办理中" },
      { name: "环境影响评价审批", department: "生态环境局", plannedDate: "2026-09-25", status: "办理中" },
      { name: "节能审查", department: "发展和改革委员会", plannedDate: "2026-10-15", status: "待启动" },
      { name: "城镇污水排入排水管网许可", department: "城市管理局", plannedDate: "2026-11-20", status: "待启动" },
      { name: "建设工程竣工验收备案", department: "住房和城乡建设局", plannedDate: "2028-06-30", status: "待启动" }
    ];

    const statusClassNames = {
      "待启动": "pending",
      "办理中": "processing",
      "已完成": "completed"
    };

    const approvalList = document.querySelector("#approval-list");
    const statusFilter = document.querySelector("#status-filter");
    const resultCount = document.querySelector("#result-count");

    function renderApprovalItems(status) {
      const visibleItems = status === "全部"
        ? approvalItems
        : approvalItems.filter((item) => item.status === status);

      resultCount.textContent = visibleItems.length;

      if (visibleItems.length === 0) {
        approvalList.innerHTML = '<tr><td class="empty-state" colspan="4">当前状态下暂无审批事项。</td></tr>';
        return;
      }

      approvalList.innerHTML = visibleItems.map((item) => `
        <tr>
          <td class="item-name" data-label="审批事项名称">${item.name}</td>
          <td data-label="主管部门">${item.department}</td>
          <td data-label="计划完成时间">${item.plannedDate}</td>
          <td data-label="当前状态">
            <span class="status status--${statusClassNames[item.status]}">${item.status}</span>
          </td>
        </tr>
      `).join("");
    }

    statusFilter.addEventListener("change", (event) => {
      renderApprovalItems(event.target.value);
    });

    renderApprovalItems("全部");
  </script>
</body>
</html>
