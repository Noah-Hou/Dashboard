
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="项目综合管理平台">
  <title>项目综合管理平台</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --text: #172033;
      --text-muted: #64748b;
      --border: #dbe3ee;
      --surface: #ffffff;
      --background: #f3f6fa;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }

    button { font: inherit; }

    .page-header {
      color: #fff;
      background: linear-gradient(120deg, #102a56, #1d4ed8);
      border-bottom: 4px solid #60a5fa;
    }

    .page-header__inner,
    main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .page-header__inner { padding: 44px 0 40px; }

    .eyebrow {
      margin: 0 0 6px;
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 6px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.25;
    }

    .page-header p:last-child {
      margin-bottom: 0;
      color: #dbeafe;
    }

    main { padding: 38px 0 56px; }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin-bottom: 4px;
      font-size: clamp(22px, 3vw, 28px);
      line-height: 1.35;
    }

    .section-heading p {
      margin-bottom: 0;
      color: var(--text-muted);
    }

    .specialty-count {
      flex: 0 0 auto;
      padding: 4px 10px;
      color: var(--primary-dark);
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .specialty-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .specialty-card {
      position: relative;
      display: flex;
      min-height: 170px;
      padding: 24px;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .specialty-card::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: var(--primary);
      content: "";
    }

    .specialty-card:hover {
      border-color: #93c5fd;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      transform: translateY(-3px);
    }

    .specialty-card__number {
      margin-bottom: 10px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .specialty-card h3 {
      margin-bottom: 24px;
      font-size: 20px;
      line-height: 1.3;
    }

    .detail-button,
    .approval-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .detail-button {
      align-self: flex-start;
      margin-top: auto;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
    }

    .detail-button:hover,
    .detail-button:focus-visible {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .detail-button:focus-visible,
    .approval-button:focus-visible {
      outline: 3px solid rgba(96, 165, 250, 0.45);
      outline-offset: 2px;
    }

    .detail-notice {
      min-height: 26px;
      margin: 18px 0 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .approval-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      margin-top: 34px;
      padding: 26px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .approval-section h2 {
      margin-bottom: 4px;
      font-size: 21px;
    }

    .approval-section p {
      margin-bottom: 0;
      color: var(--text-muted);
    }

    .approval-button {
      flex: 0 0 auto;
      color: #fff;
      background: var(--primary-dark);
      border: 1px solid var(--primary-dark);
      text-decoration: none;
    }

    .approval-button:hover {
      background: #172554;
      border-color: #172554;
    }

    @media (max-width: 820px) {
      .specialty-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .page-header__inner,
      main { width: min(100% - 28px, 1180px); }

      .page-header__inner { padding: 32px 0 30px; }
      main { padding: 28px 0 40px; }

      .section-heading,
      .approval-section {
        align-items: flex-start;
        flex-direction: column;
      }

      .specialty-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .specialty-card { min-height: 150px; }
      .approval-button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .specialty-card,
      .detail-button,
      .approval-button { transition: none; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header__inner">
      <p class="eyebrow">Project Dashboard</p>
      <h1>你好，GitHub！</h1>
      <p>这是我创建的第一个网页。</p>
    </div>
  </header>

  <main>
    <section aria-labelledby="design-management-title">
      <div class="section-heading">
        <div>
          <h2 id="design-management-title">项目设计成果管理</h2>
          <p>集中查看和管理项目各设计专项成果。</p>
        </div>
        <span class="specialty-count">9 个设计专项</span>
      </div>

      <div class="specialty-grid">
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 01</span>
          <h3>建筑设计</h3>
          <button class="detail-button" type="button" data-specialty="建筑设计">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 02</span>
          <h3>结构设计</h3>
          <button class="detail-button" type="button" data-specialty="结构设计">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 03</span>
          <h3>基坑围护</h3>
          <button class="detail-button" type="button" data-specialty="基坑围护">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 04</span>
          <h3>桩基</h3>
          <button class="detail-button" type="button" data-specialty="桩基">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 05</span>
          <h3>幕墙</h3>
          <button class="detail-button" type="button" data-specialty="幕墙">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 06</span>
          <h3>精装修</h3>
          <button class="detail-button" type="button" data-specialty="精装修">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 07</span>
          <h3>景观</h3>
          <button class="detail-button" type="button" data-specialty="景观">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 08</span>
          <h3>燃气</h3>
          <button class="detail-button" type="button" data-specialty="燃气">查看详情</button>
        </article>
        <article class="specialty-card">
          <span class="specialty-card__number">DESIGN 09</span>
          <h3>三网</h3>
          <button class="detail-button" type="button" data-specialty="三网">查看详情</button>
        </article>
      </div>
      <p class="detail-notice" id="detail-notice" aria-live="polite"></p>
    </section>

    <section class="approval-section" aria-labelledby="approval-title">
      <div>
        <h2 id="approval-title">行政审批管理</h2>
        <p>查看项目各项行政审批事项。</p>
      </div>
      <a class="approval-button" href="approval.html">进入审批管理</a>
    </section>
  </main>

  <script>
    const detailNotice = document.querySelector("#detail-notice");

    document.querySelectorAll(".detail-button").forEach((button) => {
      button.addEventListener("click", () => {
        detailNotice.textContent = `${button.dataset.specialty}详情功能待接入。`;
      });
    });
  </script>
</body>
</html>
